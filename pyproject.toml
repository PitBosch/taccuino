[project]
name = "taccuino"
version = "0.1.0"
description = "Registratore di riunioni sempre attivo: diarization + Whisper su Intel GPU/NPU, note con Claude Code"
requires-python = ">=3.10"
dependencies = [
  "openvino-genai==2026.4.1.0",
  "huggingface_hub>=0.25",
  "sherpa-onnx==2.0.3",
  "numpy",
]

[project.scripts]
taccuino = "taccuino.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["taccuino"]
